<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เศรษฐีแม่หอพระ</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7efd9;--card:#fffaec;--ink:#3b2a1a;--mut:#7a6650;--g:#3f7d3a;--g2:#e4eccb;--o:#8a5a2b;--line:#e2d3b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#231b12;--card:#2e2418;--ink:#f3ead6;--mut:#c2b08f;--g:#7cc46f;--g2:#34402a;--o:#c08a55;--line:#4a3b28}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;line-height:1.5}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header b{font-family:'Mitr',sans-serif;font-size:20px;color:var(--g);margin-right:auto}
.btn{border:0;background:var(--g);color:#fff;padding:9px 16px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}.btn.alt{background:var(--o)}.btn:disabled{opacity:.4;cursor:default}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.mut{color:var(--mut);font-size:13px}.tag{font-size:12px;background:var(--g2);padding:2px 10px;border-radius:99px;color:var(--mut)}
#menu{text-align:center}#menu h1{font-family:'Mitr',sans-serif;color:var(--g);margin:4px 0;font-size:clamp(30px,8vw,48px)}
#menu .hero{width:190px;filter:drop-shadow(0 8px 8px #0003);animation:fl 3s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-8px) rotate(2deg)}}
.prow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin:6px 0;text-align:left}
.prow img{height:46px;width:auto;display:block}.prow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.prow select{border:1px solid var(--line);border-radius:10px;padding:6px;font:inherit;background:var(--bg);color:var(--ink)}
#board{position:relative;width:100%;aspect-ratio:1;container-type:size;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);background:#e9dcb8;border:2px solid #8a5a2b;border-radius:14px;overflow:hidden}
.sq{position:relative;border:1px solid #c9b88a;background:#fffaec;color:#3b2a1a;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;overflow:hidden;cursor:pointer;line-height:1.05}
.sq .band{height:2.6cqw;width:100%;flex:none}.sq .ic{font-size:3.6cqw;margin-top:.3cqw}.sq .nm{font-size:1.5cqw;padding:0 .3cqw;font-weight:600}.sq .pr{font-size:1.45cqw;color:#7a6650}
.sq.cn{background:#f4e3b5}.sq.cn .ic{font-size:4.6cqw}.sq.cn .nm{font-size:1.6cqw}
.sq .lv{position:absolute;right:.2cqw;top:2.7cqw;font-size:1.6cqw}
.center{grid-area:2/2/8/8;position:relative;overflow:hidden}
.center .mp{position:absolute;inset:0;width:100%;height:100%;display:block}
.center .ttl{position:absolute;z-index:2;top:2cqw;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Mitr',sans-serif;font-size:3.7cqw;line-height:1.35;color:#3f7d3a;background:#fffaece6;border:.4cqw solid #3f7d3a;border-radius:99px;padding:.2cqw 3cqw;text-shadow:0 .2cqw 0 #fff;box-shadow:0 .5cqw 0 #3f7d3a55}
.center .hh{position:absolute;z-index:2;left:1.5cqw;bottom:.4cqw;height:19cqw;filter:drop-shadow(0 .6cqw .5cqw #0004);animation:bob 2.6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-.8cqw)}}
.center .bub{position:absolute;z-index:2;left:21.5cqw;bottom:3cqw;width:31cqw;background:#fffaec;border:.35cqw solid #3f7d3a;border-radius:2.4cqw;padding:1.2cqw 1.8cqw;font-size:2.2cqw;line-height:1.3;color:#3b2a1a;font-weight:600;box-shadow:0 .5cqw 0 #3f7d3a44}
.center .bub::before{content:"";position:absolute;left:-1.7cqw;bottom:2cqw;border:1cqw solid transparent;border-right:1.7cqw solid #3f7d3a;border-left:0}
.center .bub::after{content:"";position:absolute;left:-1.1cqw;bottom:2.25cqw;border:.75cqw solid transparent;border-right:1.3cqw solid #fffaec;border-left:0}
.dicebox{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:27cqw;padding:2cqw 1.5cqw 1.1cqw;border-radius:3cqw;text-align:center;background:repeating-linear-gradient(90deg,#efca85 0 2.6cqw,#e0b46c 2.6cqw 2.8cqw);border:.5cqw solid #a8743a;box-shadow:0 .8cqw 0 #8a5a2b,0 1.6cqw 1.8cqw #0005,inset 0 .3cqw 0 #fff7;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.dicebox::before{content:"";position:absolute;inset:.8cqw;border:.25cqw dashed #a8743a99;border-radius:2.3cqw;pointer-events:none}
.dicebox.can{cursor:pointer;animation:pulse 1.3s ease-in-out infinite}@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.045)}}
.dhint{position:relative;margin-top:1.1cqw;font-size:2.1cqw;font-weight:600;color:#5a3a1a;line-height:1.25;min-height:2.6cqw}
#dice{display:flex;justify-content:center;gap:3cqw}
.die{width:10cqw;height:10cqw;border-radius:2.3cqw;background:linear-gradient(145deg,#fff,#f4e9cc);box-shadow:0 .45cqw 0 #cbb68a,0 .9cqw .8cqw #0004,inset 0 -.3cqw .3cqw #e6d7b0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1.4cqw}
.die i{border-radius:50%;margin:12%}.die i.on{background:#3b2a1a;box-shadow:inset 0 -.15cqw .15cqw #0007}.die[data-v="1"] i.on{background:#e0553a;margin:0}
@keyframes tmb{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(-1cqw,-2.4cqw) rotate(80deg)}40%{transform:translate(1cqw,0) rotate(170deg)}60%{transform:translate(-.6cqw,-1.8cqw) rotate(260deg)}80%{transform:translate(.8cqw,0) rotate(330deg)}100%{transform:translate(0,0) rotate(360deg)}}
@keyframes lnd{0%{transform:translateY(-1.8cqw) scale(1.12)}60%{transform:translateY(.3cqw) scale(.96)}100%{transform:none}}
#dice.rolling .die{animation:tmb .38s linear infinite}#dice.rolling .die+.die{animation-direction:reverse;animation-duration:.32s}#dice.land .die{animation:lnd .35s ease-out}
.tk{position:absolute;width:6.2cqw;transform:translate(-50%,-62%);transition:left .22s,top .22s;z-index:5;pointer-events:none}
.tk img{width:100%;display:block;filter:drop-shadow(0 0 .22cqw var(--pc)) drop-shadow(0 0 .22cqw var(--pc)) drop-shadow(0 .35cqw .3cqw #0006)}
.tk .no{position:absolute;right:-.7cqw;top:-.3cqw;width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--pc);color:#fff;font:600 1.7cqw/2.5cqw 'Mitr',sans-serif;font-style:normal;text-align:center;border:.22cqw solid #fff}
.tk.on img{animation:hop .8s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-.9cqw)}}
.av{position:relative;display:inline-block;flex:none}.av .no{position:absolute;right:-6px;bottom:-3px;min-width:17px;height:17px;border-radius:99px;background:var(--pc);color:#fff;font:600 11px/16px 'Mitr',sans-serif;font-style:normal;text-align:center;border:1.5px solid #fff}
@media (prefers-reduced-motion:reduce){.center .hh,.dicebox.can,.tk.on img,#dice.rolling .die,#dice.land .die{animation:none}}
.pl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pc{flex:1;min-width:120px;border:3px solid var(--line);border-radius:14px;padding:5px 8px;background:var(--card);display:flex;gap:6px;align-items:center;font-size:13px}.pc.on{box-shadow:0 0 0 3px #ffd24d}.pc.out{opacity:.4}.pc img{height:38px;width:auto;display:block}.pc b{display:block;font-size:14px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}.bts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.log{margin-top:10px;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:60px}
#pop{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:60;padding:14px}#pop.on{display:flex}
#pop>div{background:var(--card);border:3px solid var(--g);border-radius:24px;max-width:480px;width:100%;padding:16px;max-height:92vh;overflow:auto}
#popc h3{margin:4px 0}#popc h4{margin:8px 0 2px;color:var(--g)}#popc p{margin:6px 0}.pi{width:100%;border-radius:14px;display:block;margin-bottom:6px}
#popb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}.rg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px;font:inherit;font-size:12px;cursor:pointer}
#fc{width:100%;max-width:340px;display:block;margin:6px auto;border-radius:12px;touch-action:none;background:#cdeaf6}
.sks{display:flex;gap:6px;justify-content:center}#skins{margin:0 0 8px}
.sk{flex:1;max-width:96px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:4px 4px 3px;cursor:pointer;font:inherit;font-size:11px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;-webkit-tap-highlight-color:transparent}
.sk img{height:42px;width:auto;display:block}.sk.on{border-color:var(--g);background:var(--g2);box-shadow:0 0 0 2px var(--g)}
/* fit-to-screen layout */
#board{margin:0 auto;max-width:max(300px,calc(100dvh - 405px))}
@media (orientation:landscape) and (min-width:700px){
 main{max-width:none;padding:8px 14px}
 #game:not([hidden]){display:grid;grid-template-columns:min(calc(100dvh - 78px),60vw) 1fr;grid-template-rows:auto auto auto 1fr;gap:8px 16px;align-items:start}
 #board{grid-row:1/5;grid-column:1;max-width:none;margin:0;width:100%}
 #pl{grid-column:2;grid-row:1;margin:0;flex-direction:column;flex-wrap:nowrap}
 #skins{grid-column:2;grid-row:2;margin:0}
 #game .ctl{grid-column:2;grid-row:3}
 #game .log{grid-column:2;grid-row:4;margin:0}
}
</style></head><body>
<header><b>เศรษฐีแม่หอพระ</b><button class="btn alt" onclick="rules()">กติกา</button><button class="btn" onclick="fruitGame(false)">🎮 เก็บผลไม้</button></header>
<main>
<section id="menu" class="card" hidden>
<img class="hero" id="mh" alt="ผำน้อย"><h1>เศรษฐีแม่หอพระ</h1>
<p class="mut" style="max-width:480px;margin:0 auto 8px">ซื้อสถานที่ ท่องเที่ยว และสะสมของดีของชุมชน! ทอยลูกเต๋าเดินรอบแม่หอพระ แวะพักกินผำ และอย่าลืมพักเล่นเกมเก็บผลไม้</p>
<div id="setup"></div>
<p><button class="btn" style="font-size:18px;padding:12px 30px" onclick="startGame()">เริ่มเกม</button></p>
</section>
<section id="game" hidden>
<div id="board"></div>
<div id="pl" class="pl"></div><div id="skins"></div>
<div class="ctl">
<div class="bts"><button id="bRoll" class="btn" onclick="humanRoll()">🎲 ทอยลูกเต๋า</button><button id="bRest" class="btn alt" onclick="restGame()">🎮 พักเล่นเกมเก็บผลไม้</button><button id="bUp" class="btn alt" onclick="upgrade()">🏠 พัฒนาสถานที่</button><button id="bEnd" class="btn alt" onclick="endAsk()">🏁 จบเกม</button></div></div>
<div id="log" class="log"></div>
</section>
</main>
<div id="pop"><div><div id="popc"></div><div id="popb"></div></div></div>

function fitLabels(root){(root||document).querySelectorAll('.lb').forEach(g=>{const t=g.querySelector('.lt'),t2=g.querySelector('.lt2'),r=g.querySelector('.lr'),p=g.querySelector('.lp0');
 let w=t.getBBox().width;if(t2)w=Math.max(w,t2.getBBox().width);const W=w+34;r.setAttribute('x',-W/2);r.setAttribute('width',W);const tx=-W/2+25;t.setAttribute('x',tx);if(t2)t2.setAttribute('x',tx);p.setAttribute('transform','translate('+(-W/2+13)+' 0)')})}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function setDie(d,v){d.dataset.v=v;d.innerHTML=[0,1,2,3,4,5,6,7,8].map(k=>'<i'+(PIPS[v].includes(k)?' class="on"':'')+'></i>').join('')}
const SK=['ผำน้อย','ผำ','ถั่วเน่าแผ่น','ตะเคียน'];let skin=0;try{skin=+localStorage.getItem('mhp_skin')||0}catch(e){}if(!(skin>=0&&skin<SK.length))skin=0;
function buildSkins(){$('#skins').innerHTML='<div class="mut" style="text-align:center;margin-bottom:3px">เลือกหมากของคุณ</div><div class="sks">'+SK.map((n,i)=>`<button class="sk${i==skin?' on':''}" onclick="setSkin(${i})" aria-label="${n}"><img src="${IMG.toks[i]}" alt=""><span>${n}</span></button>`).join('')+'</div>'}
function setSkin(i){skin=i;try{localStorage.setItem('mhp_skin',i)}catch(e){}buildSkins();document.querySelectorAll('.tk img').forEach(im=>im.src=IMG.toks[skin]);render()}
// ---------- popup ----------
function setB(arr){const b=$('#popb');b.innerHTML='';arr.forEach(x=>{const e=document.createElement('button');e.className='btn'+(x.alt?' alt':'');e.textContent=x.t;e.disabled=!!x.dis;e.onclick=()=>{$('#pop').classList.remove('on');pid++;x.fn&&x.fn()};b.appendChild(e)})}
function pop(html,btns){const id=++pid;$('#popc').innerHTML=html;setB(btns);$('#pop').classList.add('on');
const p=G&&G.players[G.cur];if(p&&p.cpu&&G.phase!='end'&&btns.length){const d=btns.find(x=>x.d&&!x.dis)||btns.find(x=>!x.dis);if(d)setTimeout(()=>{if(pid===id){const e=$('#popb').children[btns.indexOf(d)];e&&e.click()}},1400)}}
function rules(){pop(`<h3>📖 กติกา</h3><ul style="padding-left:18px;font-size:14px"><li>เริ่มด้วย ฿1,500 ทอยลูกเต๋า 2 ลูกแล้วเดินรอบแม่หอพระ ผ่านท่าอากาศยานรับ ฿200</li><li>ลงช่องสถานที่ที่ยังไม่มีเจ้าของ เลือก “ซื้อ” ได้ ถ้ามีเจ้าของแล้วต้องจ่ายค่าผ่านทาง</li><li>ถือครบกลุ่มสี ค่าผ่านทางเพิ่มเท่าตัว และ “พัฒนาสถานที่” ได้สูงสุด 3 ระดับ ค่าผ่านทางยิ่งแพง</li><li>ช่องสินค้า (ผำ สมุนไพร ถั่วเน่า ลำไย-เงาะ) ถือยิ่งมาก ค่าผ่านทางยิ่งสูง</li><li>ทอยเบิ้ลได้ทอยอีก แต่เบิ้ล 3 ครั้งติด ต้องไปพักกินผำ</li><li><b>ศาลาพักกินผำ:</b> ถูกส่งมาแล้วหยุดเล่น 3 ตา พร้อมเรียนรู้เรื่องผำ (จ่าย ฿50 ออกก่อนได้)</li><li><b>นั่งรถเล่น:</b> เลือกสถานที่ที่อยากไปได้ 1 แห่ง</li><li><b>พักเล่นเกม:</b> ก่อนทอย เล่นเกมเก็บเงาะ-ลำไย ได้เงินสูงสุด ฿200 (ตาละ 1 ครั้ง)</li><li>เงินไม่พอ ระบบขายสถานที่คืนธนาคารให้ ถ้ายังไม่พอ ล้มละลาย คนสุดท้ายที่เหลือชนะ</li></ul>`,[{t:'เข้าใจแล้ว'}])}
// ---------- menu ----------
let cfg=[{on:1,cpu:0},{on:1,cpu:1},{on:0,cpu:1},{on:0,cpu:1}];
function menu(){$('#setup').innerHTML=cfg.map((c,i)=>`<div class="prow"><span class="av" style="--pc:${PC[i]}"><img src="${IMG.toks[skin]}" alt=""><i class="no">${i+1}</i></span><input id="nm${i}" value="${NAMES[i]}" maxlength="14"><select onchange="cfg[${i}].cpu=+this.value"><option value="0"${c.cpu?'':' selected'}>คนเล่น</option><option value="1"${c.cpu?' selected':''}>คอมพิวเตอร์</option></select><label><input type="checkbox" ${c.on?'checked':''} ${i<2?'disabled':''} onchange="cfg[${i}].on=this.checked?1:0" style="flex:none"> เล่น</label></div>`).join('')}
function startGame(){const ps=[];cfg.forEach((c,i)=>{if(c.on)ps.push({id:ps.length,c:i,n:(($('#nm'+i)||{}).value||NAMES[i]).trim(),money:1500,pos:0,jail:0,cpu:!!c.cpu,out:false})});
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
G={players:ps,cur:0,own:Array(28).fill(-1),lvl:Array(28).fill(0),phase:'idle',dbl:0,again:false,rest:false,log:[],chd:sh(CH),ccd:sh(CC)};
$('#menu').hidden=true;$('#game').hidden=false;buildBoard();say('เริ่มเกม! ตาของ '+ps[0].n);turnStart()}
function buildBoard(){const b=$('#board');b.innerHTML='';SQ.forEach((s,i)=>{const [r,c]=XY(i),e=document.createElement('div');e.className='sq'+(s.pr&&s.t!='prop'&&s.t!='st'?'':'')+(i%7==0?' cn':'');e.style.gridRow=r+1;e.style.gridColumn=c+1;
e.innerHTML=(s.g?`<div class="band" style="background:${COL[s.g]}"></div>`:'<div class="band"></div>')+`<span class="ic">${s.i}</span><span class="nm">${s.n}</span>`+(s.pr?`<span class="pr">${money(s.pr)}</span>`:'')+'<i class="lv"></i>';e.onclick=()=>{if(!$('#pop').classList.contains('on'))pop(info(i),[{t:'ปิด'}])};b.appendChild(e)});
b.insertAdjacentHTML('beforeend',`<div class="center">${MAPSVG}<div class="ttl">เศรษฐีแม่หอพระ</div><div class="dicebox" id="dicebox" onclick="humanRoll()" role="button" aria-label="ลูกเต๋า แตะเพื่อทอย"><div id="dice"><div class="die"></div><div class="die"></div></div><div class="dhint" id="dh"></div></div><img class="hh" src="${IMG.hero}" alt=""><div class="bub" id="bub">ยินดีต้อนรับ!</div></div>`);
document.querySelectorAll('.die').forEach((d,k)=>setDie(d,[5,2][k]));fitLabels(b);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitLabels(b));
const O=[[-2.4,-2.2],[2.4,-2.2],[-2.4,2.2],[2.4,2.2]];G.players.forEach(p=>{const t=document.createElement('div');t.className='tk';t.id='tk'+p.id;t.style.setProperty('--pc',PC[p.c]);t.innerHTML=`<img src="${IMG.toks[skin]}" alt=""><i class="no">${p.c+1}</i>`;t.style.marginLeft=O[p.id][0]+'cqw';t.style.marginTop=O[p.id][1]+'cqw';b.appendChild(t)})}
// ---------- info/rent ----------
function info(i){const s=SQ[i];let h=s.im?`<img class="pi" src="${IMG[s.im]}" alt="">`:'';h+=`<h3>${s.i} ${s.n}</h3>`;if(s.g)h+=`<span class="tag" style="background:${COL[s.g]};color:#fff">กลุ่มสี ${s.g}</span>`;h+=`<p>${s.d||''}</p>`;
if(s.t=='prop')h+=`<p class="mut">ราคา ${money(s.pr)} · ค่าผ่านทางเริ่มต้น ${money(Math.ceil(s.pr/10))} (ถือครบกลุ่มสีเท่าตัว พัฒนาแล้วยิ่งแพง)</p>`+HIS;
if(s.t=='st')h+=`<p class="mut">ราคา ${money(s.pr)} · ค่าผ่านทาง ฿25 / ฿50 / ฿100 / ฿200 ตามจำนวนสินค้าที่ถือ</p>`;
if(G&&(s.t=='prop'||s.t=='st')&&G.own[i]>=0)h+=`<p>🏷️ เจ้าของ: <b>${G.players[G.own[i]].n}</b>${G.lvl[i]?' · พัฒนา '+'🏠'.repeat(G.lvl[i]):''}</p>`;return h}
const ownsSet=(o,g)=>SQ.every((s,k)=>s.g!=g||G.own[k]==o);
function rent(i){const s=SQ[i],o=G.own[i];if(s.t=='st'){const n=SQ.filter((q,k)=>q.t=='st'&&G.own[k]==o).length;return 25*2**(n-1)}
const b=Math.ceil(s.pr/10),L=G.lvl[i];return b*[1,3,6,10][L]*(L==0&&ownsSet(o,s.g)?2:1)}
const worth=p=>p.money+G.own.reduce((t,o,i)=>t+(o==p.id?SQ[i].pr+G.lvl[i]*Math.floor(SQ[i].pr/2):0),0);
// ---------- render ----------
function say(t){G.log.unshift(t);G.log=G.log.slice(0,5);$('#log').innerHTML=G.log.map(x=>`<div>${x}</div>`).join('');$('#bub').textContent=t}
function render(){if(!G)return;document.querySelectorAll('.sq').forEach((e,i)=>{const o=G.own[i];e.style.boxShadow=o>=0?`inset 0 0 0 .5cqw ${PC[G.players[o].c]}`:'';e.querySelector('.lv').textContent='🏠'.repeat(G.lvl[i])});
G.players.forEach(p=>{const t=$('#tk'+p.id);t.classList.toggle('on',p.id==G.cur&&G.phase!='end');if(p.out){t.style.display='none';return}const [r,c]=XY(p.pos);t.style.left=(c+.5)*12.5+'%';t.style.top=(r+.5)*12.5+'%'});
$('#pl').innerHTML=G.players.map((p,k)=>`<div class="pc${k==G.cur?' on':''}${p.out?' out':''}" style="border-color:${PC[p.c]}"><span class="av" style="--pc:${PC[p.c]}"><img src="${IMG.toks[skin]}" alt=""><i class="no">${p.c+1}</i></span><div><b>${p.n}${p.cpu?' 🤖':''}</b>${money(p.money)}<br><span class="mut">${G.own.filter(o=>o==p.id).length} แห่ง${p.jail?' · พักผำ '+p.jail:''}</span></div></div>`).join('');
const p=G.players[G.cur],my=G.phase=='roll'&&!p.cpu&&!p.out;$('#dicebox').classList.toggle('can',my);$('#dh').textContent=my?'👆 แตะลูกเต๋าเพื่อทอย':G.phase=='end'?'จบเกม':'ตาของ '+p.n+(p.cpu?' 🤖':'');$('#bRoll').disabled=!my;$('#bRest').disabled=!(my&&!G.rest);
$('#bUp').disabled=!(my&&upList().length);$('#bEnd').disabled=G.phase=='end'}
// ---------- turn flow ----------
function turnStart(){const p=G.players[G.cur];render();
if(p.jail>0){p.jail--;say(`${p.n} พักกินผำ (เหลือ ${p.jail} ตา)`);
pop(`<h3>🍲 ศาลาพักกินผำ</h3><p>${p.n} แวะพักกินผำ หยุดเล่น เหลืออีก <b>${p.jail}</b> ตา</p><h4>รู้หรือไม่เกี่ยวกับผำ</h4><p>${FACTS[(2-p.jail+4)%4]}</p>`,[{t:'จ่าย ฿50 ออกก่อน',alt:1,dis:p.money<50||p.jail==0,fn:()=>{p.money-=50;p.jail=0;say(`${p.n} จ่าย ฿50 ออกจากศาลาก่อน`);ready()}},{t:'พักต่อ',d:1,fn:endTurn}]);return}
ready()}
function ready(){const p=G.players[G.cur];G.phase='roll';G.rest=false;render();if(p.cpu)setTimeout(()=>{if(G.phase=='roll'&&G.players[G.cur]===p)cpuUp(p),roll()},1000)}
function cpuUp(p){const l=upList();if(l.length&&p.money>700){const i=l[0];p.money-=Math.floor(SQ[i].pr/2);G.lvl[i]++;say(`${p.n} พัฒนา ${SQ[i].n}`)}}
function humanRoll(){if(!G.players[G.cur].cpu)roll()}
function roll(){if(G.phase!='roll')return;const p=G.players[G.cur];G.phase='moving';render();const ds=[...document.querySelectorAll('.die')],bx=$('#dice');let n=0;bx.classList.remove('land');bx.classList.add('rolling');
const iv=setInterval(()=>{ds.forEach(d=>setDie(d,rnd(6)+1));if(++n>8){clearInterval(iv);fin()}},70);
function fin(){const a=rnd(6)+1,b=rnd(6)+1;setDie(ds[0],a);setDie(ds[1],b);bx.classList.remove('rolling');void bx.offsetWidth;bx.classList.add('land');say(`${p.n} ทอยได้ ${a}+${b} = ${a+b}`);G.again=a==b;
if(a==b){G.dbl++;if(G.dbl>=3){sendJail('ทอยเบิ้ลติดกัน 3 ครั้ง!');return}}else G.dbl=0;move(a+b)}}
function move(n){const p=G.players[G.cur];let k=0;const iv=setInterval(()=>{p.pos=(p.pos+1)%28;if(p.pos==0){p.money+=200;say(`${p.n} ผ่านท่าอากาศยาน รับ ฿200`)}render();if(++k>=n){clearInterval(iv);setTimeout(land,320)}},220)}
function after(){const p=G.players[G.cur];render();if(G.again&&!p.out&&p.jail==0){G.again=false;say(`${p.n} ทอยเบิ้ล ได้ทอยอีกครั้ง!`);ready()}else endTurn()}
function endTurn(){G.dbl=0;G.again=false;let n=0;do{G.cur=(G.cur+1)%G.players.length;n++}while(G.players[G.cur].out&&n<9);
if(G.players.filter(p=>!p.out).length<=(G.players.length>1?1:0)){finish();return}say('ตาของ '+G.players[G.cur].n);turnStart()}
function sendJail(why){const p=G.players[G.cur];p.pos=7;p.jail=3;G.again=false;G.dbl=0;render();say(`${p.n} ไปพักกินผำ หยุด 3 ตา`);
pop(`<h3>🍲 ศาลาพักกินผำ</h3><p>${why}</p><p>${p.n} ต้องแวะพักกินผำ <b>หยุดเล่น 3 ตา</b></p><h4>รู้หรือไม่เกี่ยวกับผำ</h4><p>${FACTS[0]}</p>`,[{t:'ตกลง',d:1,fn:endTurn}])}
// ---------- money ----------
function gain(p,n){p.money+=n;say(`${p.n} ได้รับ ${money(n)}`)}
function pay(f,t,n){f.money-=n;if(t)t.money+=n;say(`${f.n} จ่าย ${money(n)}${t?' ให้ '+t.n:''}`);settle(f)}
function settle(p){while(p.money<0){const l=G.own.map((o,i)=>o==p.id?i:-1).filter(i=>i>=0).sort((a,b)=>SQ[a].pr-SQ[b].pr);if(!l.length)break;const i=l[0],v=Math.floor(SQ[i].pr/2)+G.lvl[i]*Math.floor(SQ[i].pr/4);p.money+=v;G.own[i]=-1;G.lvl[i]=0;say(`${p.n} ขาย ${SQ[i].n} คืนธนาคาร +${money(v)}`)}
if(p.money<0){p.out=true;G.own.forEach((o,i)=>{if(o==p.id){G.own[i]=-1;G.lvl[i]=0}});say(`${p.n} ล้มละลาย!`)}render()}
// ---------- landing ----------
function land(){const p=G.players[G.cur],i=p.pos,s=SQ[i],head=info(i);render();
if(s.t=='prop'||s.t=='st'){const go=()=>{if(G.own[i]<0)buyFlow(i,head);else if(G.own[i]==p.id)pop(head+'<p>✅ เป็นสถานที่ของคุณเอง แวะพักผ่อนได้เลย</p>',[{t:'ตกลง',d:1,fn:after}]);
else{const o=G.players[G.own[i]],r=rent(i);pop(head+`<p>ค่าผ่านทาง <b>${money(r)}</b> ให้ ${o.n}</p>`,[{t:`จ่าย ${money(r)}`,d:1,fn:()=>{pay(p,o,r);after()}}])}};
if(s.q)quiz(go);else go()}
else if(s.t=='ch'||s.t=='cc')card(s.t);
else if(s.t=='tax')pop(head,[{t:`จ่าย ${money(s.pr)}`,d:1,fn:()=>{pay(p,null,s.pr);after()}}]);
else if(s.t=='gj')pop(head,[{t:'ไปเลย!',d:1,fn:()=>sendJail('ผำน้อยชวนไปกินผำ!')}]);
else if(s.t=='park')park(head);
else if(s.t=='jail')pop(head+`<h4>รู้หรือไม่เกี่ยวกับผำ</h4><p>${FACTS[rnd(4)]}</p>`,[{t:'ตกลง',d:1,fn:after}]);
else pop(head,[{t:'ตกลง',d:1,fn:after}])}
function buyFlow(i,head){const p=G.players[G.cur],s=SQ[i],can=p.money>=s.pr,ok=can&&p.money-s.pr>=300;
pop(head+`<p>ยังไม่มีเจ้าของ — คุณมี ${money(p.money)}</p>`,[{t:`ซื้อ ${money(s.pr)}`,dis:!can,d:ok,fn:()=>{p.money-=s.pr;G.own[i]=p.id;say(`${p.n} ซื้อ ${s.n}`);after()}},{t:'ไม่ซื้อ',alt:1,d:!ok,fn:after}])}
function quiz(done){const A=['ถูกใจผำน้อยครับ! ตะเคียนเป็นไม้ยืนต้นขนาดใหญ่ อายุยืนมาก ให้ร่มเงาและเป็นบ้านของสัตว์เล็ก ๆ','ถูกอีกข้อครับ! เนื้อไม้ตะเคียนแข็งทนทาน คนสมัยก่อนนิยมนำมาทำเสาบ้านและเรือ','น่าสนใจครับ! ในความเชื่อของไทย มีเรื่องเล่าว่าต้นตะเคียนใหญ่มี “แม่ตะเคียน” คอยปกปักรักษา คนจึงเคารพต้นไม้'];
const ans=k=>{gain(G.players[G.cur],20);pop(`<p>${A[k]}</p><p>🎉 ทุกคำตอบมีส่วนถูก รับ ฿20</p>`,[{t:'ไปต่อ',d:1,fn:done}])};
pop(`<h3>🌲 แม่ตะเคียน</h3><p>ตอนนี้ผำน้อยพามาที่ “แม่ตะเคียน” นะครับ! ในความคิดพี่ ๆ ต้นตะเคียนเป็นยังไงครับ?</p>`,[{t:'🌳 ต้นไม้ใหญ่ที่ยังมีชีวิต',fn:()=>ans(0)},{t:'🪵 ท่อนไม้แข็งแรงใช้ทำของ',fn:()=>ans(1)},{t:'✨ ที่สถิตของแม่ตะเคียน',fn:()=>ans(2)}])}
// cards
const CH=[{t:'ขายลำไยได้ราคาดี รับ ฿150',f:p=>{gain(p,150);after()}},{t:'ฝนตกหนัก ถนนเสีย จ่ายค่าซ่อม ฿80',f:p=>{pay(p,null,80);after()}},{t:'ผำน้อยพาเดินหน้า 3 ช่อง',f:p=>fwd(3)},{t:'ลื่นล้มเบา ๆ ถอยหลัง 2 ช่อง',f:p=>{p.pos=(p.pos+26)%28;render();setTimeout(land,350)}},
{t:'เห็ดนางฟ้าออกดอกเยอะ ขายได้ ฿100',f:p=>{gain(p,100);after()}},{t:'แวะกินแกงผำเพลินจนลืมเวลา! ไปศาลาพักกินผำ หยุด 3 ตา',f:p=>sendJail('แวะกินแกงผำเพลิน!')},
{t:'ได้รับรางวัลชุมชนดีเด่น รับจากผู้เล่นอื่นคนละ ฿30',f:p=>{G.players.forEach(o=>{if(o!==p&&!o.out){o.money-=30;p.money+=30;settle(o)}});say(`${p.n} รับ ฿30 จากทุกคน`);after()}},{t:'ซื้อถั่วเน่าแผ่นเป็นของฝาก จ่าย ฿60',f:p=>{pay(p,null,60);after()}},
{t:'ไปท่าอากาศยานรับของฝาก เดินไปจุดเริ่มต้น รับ ฿200',f:p=>{p.pos=0;gain(p,200);render();after()}},{t:'ชนะเกมตอบคำถามแม่ตะเคียน รับ ฿120',f:p=>{gain(p,120);after()}},{t:'ผำน้อยเรียกรถมารับ! เลือกไปสถานที่ใดก็ได้',f:p=>park('')}];
const CC=[{t:'รับเงินปันผลกองทุนชุมชน ฿100',f:p=>{gain(p,100);after()}},{t:'ขายสมุนไพรได้ ฿80',f:p=>{gain(p,80);after()}},{t:'ได้เงินคืนภาษี ฿50',f:p=>{gain(p,50);after()}},{t:'ชาวบ้านลงแขกเกี่ยวข้าว ได้ค่าแรง ฿60',f:p=>{gain(p,60);after()}}];
function fwd(n){const p=G.players[G.cur];const t=(p.pos+n)%28;if(t<p.pos)gain(p,200);p.pos=t;render();setTimeout(land,350)}
function card(k){const p=G.players[G.cur],d=k=='ch'?G.chd:G.ccd,c=d.shift();d.push(c);pop(`<h3>${k=='ch'?'🎁 โชคจากผำน้อย':'💰 กองทุนชุมชน'}</h3><p style="font-size:18px">${c.t}</p>`,[{t:'ตกลง',d:1,fn:()=>c.f(p)}])}
function park(head){const p=G.players[G.cur],ch=SQ.map((s,i)=>i).filter(i=>i!=p.pos&&i!=21);
pop((head||'')+`<h3>🚐 เลือกสถานที่ที่จะไป</h3><div class="rg">${ch.map(i=>`<button onclick="rideTo(${i})">${SQ[i].i} ${SQ[i].n}${SQ[i].pr&&G.own[i]<0&&SQ[i].t!='tax'?' · '+money(SQ[i].pr):''}</button>`).join('')}</div>`,[]);
if(p.cpu){const un=ch.filter(i=>(SQ[i].t=='prop'||SQ[i].t=='st')&&G.own[i]<0&&SQ[i].pr<=p.money-250).sort((a,b)=>SQ[b].pr-SQ[a].pr);setTimeout(()=>rideTo(un.length?un[0]:ch[rnd(ch.length)]),1300)}}
function rideTo(i){const p=G.players[G.cur];$('#pop').classList.remove('on');pid++;if(i==0)gain(p,200);p.pos=i;say(`${p.n} นั่งรถไป ${SQ[i].n}`);render();setTimeout(land,400)}
// upgrade
const upList=()=>{const p=G.players[G.cur];return SQ.map((s,i)=>i).filter(i=>G.own[i]==p.id&&SQ[i].t=='prop'&&ownsSet(p.id,SQ[i].g)&&G.lvl[i]<3&&p.money>=Math.floor(SQ[i].pr/2))};
function upgrade(){const p=G.players[G.cur],l=upList();pop(`<h3>🏠 พัฒนาสถานที่</h3><p class="mut">ต้องถือครบกลุ่มสี พัฒนาได้สูงสุด 3 ระดับ ค่าผ่านทางเพิ่มขึ้น</p>`,l.map(i=>({t:`${SQ[i].n} (ระดับ ${G.lvl[i]}→${G.lvl[i]+1}) ${money(Math.floor(SQ[i].pr/2))}`,fn:()=>{p.money-=Math.floor(SQ[i].pr/2);G.lvl[i]++;say(`${p.n} พัฒนา ${SQ[i].n} เป็นระดับ ${G.lvl[i]}`);render()}})).concat([{t:'ปิด',alt:1}]))}
// end
function endAsk(){pop('<p>จบเกมและนับคะแนนตอนนี้เลยหรือไม่?</p>',[{t:'จบเกม',fn:()=>finish()},{t:'เล่นต่อ',alt:1}])}
function finish(){G.phase='end';render();const r=[...G.players].sort((a,b)=>worth(b)-worth(a));pop(`<div style="text-align:center"><img src="${IMG.hero}" style="height:120px" alt=""><h3>${r.length>1?'🏆 '+r[0].n+' ชนะ!':'🎉 จบเกม!'}</h3></div>`+r.map((p,k)=>`<div class="row"><span>${k+1}. ${p.n}${p.out?' (ล้มละลาย)':''}</span><b>${money(worth(p))}</b></div>`).join('')+'<p class="mut">นับจากเงิน + มูลค่าสถานที่</p>',[{t:'เล่นใหม่',fn:()=>{G=null;cfg=[{on:1,cpu:0}];startGame()}}])}
// ---------- fruit mini-game ----------
function restGame(){if(G.phase=='roll'&&!G.rest&&!G.players[G.cur].cpu)fruitGame(true)}
function fruitGame(inG){const p=inG?G.players[G.cur]:null;
pop(`<h3>🎮 เก็บผลไม้ เงาะ &amp; ลำไย</h3><p class="mut" style="margin:2px 0">ลากนิ้ว/เมาส์ หรือกดลูกศรซ้าย-ขวา เก็บผลไม้ให้ได้มากที่สุดใน 30 วินาที${inG?' • ผลไม้ละ ฿10 (สูงสุด ฿200)':''}</p><div class="row"><b id="fs">เก็บได้ 0</b><b id="ft">30</b></div><canvas id="fc" width="320" height="400"></canvas>`,[{t:'ออกจากเกม',alt:1,fn:()=>{run=false}}]);
const c=$('#fc'),x=c.getContext('2d'),H=new Image();H.src=IMG.hero;let px=160,sc=0,tl=30,it=[],sp=0,run=true,last=performance.now();
const key=e=>{if(e.key=='ArrowLeft')px=Math.max(34,px-24);if(e.key=='ArrowRight')px=Math.min(286,px+24)},mv=e=>{const r=c.getBoundingClientRect();px=Math.max(34,Math.min(286,(e.clientX-r.left)/r.width*320))};
addEventListener('keydown',key);c.addEventListener('pointermove',mv);c.addEventListener('pointerdown',mv);
function fruit(o){x.save();x.translate(o.x,o.y);if(o.k=='r'){x.fillStyle='#e23a2e';x.beginPath();x.arc(0,0,12,0,7);x.fill();x.strokeStyle='#f0653a';x.lineWidth=2;for(let a=0;a<6.28;a+=.52){x.beginPath();x.moveTo(Math.cos(a)*12,Math.sin(a)*12);x.lineTo(Math.cos(a)*17,Math.sin(a)*17);x.stroke()}x.fillStyle='#7cc04a';x.beginPath();x.arc(0,-12,3,0,7);x.fill()}
else{x.fillStyle=o.k=='g'?'#ffd24d':'#c99557';x.beginPath();x.arc(0,0,11,0,7);x.fill();x.strokeStyle=o.k=='g'?'#e0a800':'#a8763a';x.lineWidth=2;x.stroke();x.fillStyle='#ffffff66';x.beginPath();x.arc(-4,-4,3.5,0,7);x.fill()}x.restore()}
function loop(t){if(!run){removeEventListener('keydown',key);return}const dt=Math.min(.05,(t-last)/1000);last=t;tl-=dt;sp-=dt;
if(sp<=0){sp=.55-.22*(30-tl)/30;const k=Math.random();it.push({x:20+Math.random()*280,y:-20,v:110+Math.random()*60+(30-tl)*4,k:k<.08?'g':k<.54?'r':'l'})}
it.forEach(o=>o.y+=o.v*dt);it=it.filter(o=>{if(o.y>322&&o.y<378&&Math.abs(o.x-px)<40){sc+=o.k=='g'?3:1;return false}return o.y<430});
const g=x.createLinearGradient(0,0,0,400);g.addColorStop(0,'#bfe5f5');g.addColorStop(1,'#e8f5d0');x.fillStyle=g;x.fillRect(0,0,320,400);x.fillStyle='#8cc45f';x.fillRect(0,380,320,20);
it.forEach(fruit);const w=84,h=w*H.height/H.width||88;if(H.complete)x.drawImage(H,px-w/2,396-h,w,h);
$('#fs').textContent='เก็บได้ '+sc;$('#ft').textContent=Math.max(0,Math.ceil(tl));
if(tl<=0){run=false;removeEventListener('keydown',key);const co=Math.min(200,sc*10);$('#fs').textContent=`จบเวลา! เก็บได้ ${sc} คะแนน`;
setB(inG?[{t:`รับ ฿${co}`,fn:()=>{p.money+=co;G.rest=true;say(`${p.n} เล่นเก็บผลไม้ ได้ ${money(co)}`);render()}}]:[{t:'เล่นอีกครั้ง',fn:()=>fruitGame(false)},{t:'ปิด',alt:1}]);return}
requestAnimationFrame(loop)}
requestAnimationFrame(loop)}
buildSkins();cfg=[{on:1,cpu:0}];startGame();
</script></body></html>
